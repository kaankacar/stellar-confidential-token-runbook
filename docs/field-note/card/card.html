<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field Note 04</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #efe6d2; }
  body { width: 1600px; height: 1000px; overflow: hidden; }
  .card { position: relative; width: 1600px; height: 1000px; background: #efe6d2; overflow: hidden; }
  .layer { position: absolute; inset: 0; width: 1600px; height: 1000px; pointer-events: none; }
  svg.paper { display: block; }
  .etching {
    position: absolute;
    left: 350px; top: 86px;          /* 900x520, centred in the upper two-thirds */
    width: 900px; height: 520px;
  }
  .caption {
    position: absolute;
    left: 72px; bottom: 72px;
    margin: 0;
    font-family: "Special Elite", "Courier Prime", "Courier New", Courier, monospace;
    font-size: 24px;
    line-height: 1.55;
    color: #2a2520;
    white-space: pre;
    letter-spacing: 0.4px;
  }
  .vignette {
    background: radial-gradient(ellipse 78% 72% at 50% 46%, rgba(0,0,0,0) 55%, rgba(84,62,30,0.11) 100%);
    mix-blend-mode: multiply;
  }
  .fox { position: absolute; border-radius: 50%; filter: blur(7px); mix-blend-mode: multiply; }
  .fox.a { left: 1210px; top: 140px; width: 150px; height: 120px;
           background: radial-gradient(circle, rgba(158,112,52,0.14) 0%, rgba(158,112,52,0.06) 45%, rgba(158,112,52,0) 70%); }
  .fox.b { left: 300px; top: 760px; width: 90px; height: 80px;
           background: radial-gradient(circle, rgba(140,98,46,0.12) 0%, rgba(140,98,46,0) 68%); }
  .fox.c { left: 980px; top: 820px; width: 60px; height: 52px;
           background: radial-gradient(circle, rgba(140,98,46,0.10) 0%, rgba(140,98,46,0) 68%); }
</style>
</head>
<body>
<div class="card">

  <!-- Paper: base tone, large-scale mottling, fibre grain -->
  <svg class="layer paper" viewBox="0 0 1600 1000" width="1600" height="1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.0032 0.0040" numOctaves="3" seed="4" result="n"/>
        <feColorMatrix in="n" type="matrix"
          values="0 0 0 0 0.62
                  0 0 0 0 0.50
                  0 0 0 0 0.28
                  1.4 0 0 0 -0.52"/>
      </filter>
      <filter id="fibre" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.95 0.22" numOctaves="2" seed="17" result="f"/>
        <feColorMatrix in="f" type="matrix"
          values="0 0 0 0 0.35
                  0 0 0 0 0.28
                  0 0 0 0 0.18
                  0.9 0 0 0 -0.30"/>
      </filter>
      <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="29" result="g"/>
        <feColorMatrix in="g" type="matrix"
          values="0 0 0 0 0.30
                  0 0 0 0 0.24
                  0 0 0 0 0.16
                  0.8 0 0 0 -0.28"/>
      </filter>
    </defs>
    <rect width="1600" height="1000" fill="#efe6d2"/>
    <rect width="1600" height="1000" filter="url(#mottle)" opacity="0.22"/>
    <rect width="1600" height="1000" filter="url(#fibre)" opacity="0.30"/>
    <rect width="1600" height="1000" filter="url(#grain)" opacity="0.22"/>
  </svg>

  <!-- Foxing -->
  <div class="fox a"></div>
  <div class="fox b"></div>
  <div class="fox c"></div>

  <!-- Etching: a shop counter, a sealed envelope passing over it, a ledger with a lens beside it -->
  <svg class="etching" viewBox="40 60 820 400" width="900" height="520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- roughen every stroke a little, like ink on fibre -->
      <filter id="rough" x="-4%" y="-6%" width="108%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="11" result="t"/>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- stamp coverage: coarse patches of weak ink plus fine pitting -->
      <filter id="stampnoise" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.018 0.026" numOctaves="4" seed="5" result="coarse"/>
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="21" result="fine"/>
        <feComposite in="coarse" in2="fine" operator="arithmetic" k1="0" k2="0.56" k3="0.44" k4="0" result="mix"/>
        <feColorMatrix in="mix" type="matrix"
          values="3.0 0 0 0 -0.62
                  3.0 0 0 0 -0.62
                  3.0 0 0 0 -0.62
                  0   0 0 0  1"/>
      </filter>
      <mask id="stamp" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="520">
        <rect width="900" height="520" fill="#fff" filter="url(#stampnoise)"/>
      </mask>
    </defs>

    <g mask="url(#stamp)" opacity="0.88">
      <g filter="url(#rough)" fill="none" stroke="#1f1b16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

        <!-- The shop: a hanging sign, a post and a counter with a till -->
        <path d="M 118 150 Q 196 146 274 150 Q 278 196 274 242 Q 196 246 118 242 Q 114 196 118 150 Z"/>
        <path d="M 150 150 L 150 126 L 242 126 L 242 150" stroke-width="3"/>
        <text x="196" y="205" font-family="'Special Elite', Courier, monospace" font-size="24" letter-spacing="6" text-anchor="middle" fill="#1f1b16" stroke="none">SHOP</text>
        <path d="M 196 242 L 196 318"/>
        <path d="M 92 320 Q 196 316 300 320" stroke-width="5"/>
        <path d="M 104 320 L 104 392 Q 196 396 288 392 L 288 320"/>
        <path d="M 104 356 Q 196 359 288 356" stroke-width="2.4"/>
        <!-- a till on the counter -->
        <path d="M 226 292 L 226 320 M 226 292 L 278 292 L 278 320" stroke-width="3"/>
        <path d="M 236 304 L 268 304" stroke-width="2.4"/>
        <text x="196" y="426" font-family="'Special Elite', Courier, monospace" font-size="20" letter-spacing="5" text-anchor="middle" fill="#1f1b16" stroke="none">REGISTER</text>

        <!-- The envelope, sealed, crossing the gap -->
        <path d="M 360 226 Q 450 222 540 226 Q 544 283 540 340 Q 450 344 360 340 Q 356 283 360 226 Z"/>
        <path d="M 362 228 L 450 296 L 538 228"/>
        <path d="M 362 338 L 428 282 M 538 338 L 472 282" stroke-width="2.6"/>
        <!-- wax seal -->
        <path d="M 470 296 Q 474 312 462 322 Q 452 332 438 326 Q 426 320 428 306 Q 428 292 440 286 Q 452 280 464 286 Q 470 290 470 296 Z"/>
        <path stroke-width="2.8" d="M 440 310 C 444 296 452 292 454 300 C 455 306 448 312 450 314 C 454 312 460 300 464 300"/>
        <text x="450" y="426" font-family="'Special Elite', Courier, monospace" font-size="20" letter-spacing="5" text-anchor="middle" fill="#1f1b16" stroke="none">TRANSFER</text>

        <!-- dashed arrows: counter to envelope, envelope to ledger -->
        <path d="M 304 282 Q 328 270 352 280" stroke-dasharray="14 10"/>
        <path d="M 340 268 Q 350 276 358 282 Q 346 288 338 296"/>
        <path d="M 548 282 Q 576 270 606 280" stroke-dasharray="14 10"/>
        <path d="M 594 268 Q 604 276 612 282 Q 600 288 592 296"/>

        <!-- The ledger: an open book with a lens over the right page -->
        <path d="M 628 166 Q 735 160 842 166 Q 848 280 842 394 Q 735 400 628 394 Q 622 280 628 166 Z"/>
        <path d="M 735 166 L 735 394" stroke-width="2.6"/>
        <text x="735" y="203" font-family="'Special Elite', Courier, monospace" font-size="20" letter-spacing="5" text-anchor="middle" fill="#1f1b16" stroke="none">LEDGER</text>
        <path d="M 644 230 Q 688 228 722 231 M 644 256 Q 688 254 722 257 M 644 282 Q 688 280 722 283 M 644 308 Q 688 306 722 309 M 644 334 Q 688 332 722 335 M 644 360 Q 688 358 722 361" stroke-width="2.4"/>
        <path d="M 748 230 Q 790 228 828 231 M 748 256 Q 790 254 828 257" stroke-width="2.4"/>
        <!-- the lens -->
        <circle cx="782" cy="318" r="40"/>
        <circle cx="782" cy="318" r="33" stroke-width="2.2"/>
        <path d="M 810 346 L 842 378" stroke-width="7"/>
        <path d="M 766 318 Q 782 316 798 318" stroke-width="3"/>
        <text x="735" y="426" font-family="'Special Elite', Courier, monospace" font-size="20" letter-spacing="5" text-anchor="middle" fill="#1f1b16" stroke="none">AUDIT</text>
      </g>
    </g>
  </svg>

  <!-- Caption -->
  <p class="caption">Confidential Tokens on Stellar
No. 04
register / transfer / audit
2026</p>

  <!-- Torn right edge, very faint -->
  <svg class="layer" viewBox="0 0 1600 1000" width="1600" height="1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="tear" x="-2%" y="-2%" width="104%" height="104%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="3" seed="8" result="t"/>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="14" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
    <g filter="url(#tear)">
      <path d="M 1591 -10 L 1612 -10 L 1612 1010 L 1591 1010 Z" fill="#f8f2e4" opacity="0.9"/>
      <path d="M 1591 -10 L 1591 1010" stroke="#6b5a3e" stroke-width="1.2" opacity="0.16" fill="none"/>
    </g>
  </svg>

  <!-- Vignette -->
  <div class="layer vignette"></div>
</div>
</body>
</html>
